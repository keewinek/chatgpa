<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>ChatGPA — ustawienia</title>
    <style>
    :root {
      --bg: #ffffff;
      --fg: #18181b;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #6366f1;
      --ok: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181b;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --border: #3f3f46;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      max-width: 420px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: var(--bg);
      color: var(--fg);
    }
    h1 { font-size: 16px; }
    label {
      display: block;
      font-size: 13px;
      margin: 14px 0 4px;
      color: var(--muted);
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      background: var(--bg);
      color: var(--fg);
    }
    button {
      margin-top: 16px;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    p.hint {
      font-size: 12px;
      color: var(--muted);
    }
    #saved {
      font-size: 12px;
      color: var(--ok);
      margin-left: 10px;
    }
    </style>
  </head>
  <body>
    <h1>ChatGPA · Librus — ustawienia</h1>
    <label for="api">Adres ChatGPA API</label>
    <input id="api" type="url" placeholder="https://chatgpa.keewinek.deno.net" />
    <p class="hint">Zwykle nie trzeba zmieniać — tylko jeśli testujesz lokalną wersję ChatGPA.</p>
    <button id="save" type="button">Zapisz</button>
    <span id="saved" hidden>Zapisano ✓</span>
    <script src="options.js"></script>
  </body>
</html>
