<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>ChatGPA — Librus</title>
    <style>
    :root {
      --bg: #ffffff;
      --fg: #18181b;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #6366f1;
      --ok: #16a34a;
      --warn: #e8a54b;
      --err: #e85d5d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181b;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --border: #3f3f46;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      width: 280px;
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--fg);
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .logo {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
    }
    h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 600;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 12px;
      min-height: 16px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.err { background: var(--err); }
    .dot.idle { background: var(--muted); }
    .counts {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .chip {
      flex: 1;
      text-align: center;
      padding: 6px 4px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--chip-color) 15%, transparent);
      border: 1px solid color-mix(in srgb, var(--chip-color) 30%, transparent);
    }
    .chip .n {
      font-size: 15px;
      font-weight: 700;
      color: var(--chip-color);
      line-height: 1.2;
    }
    .chip .l {
      font-size: 10px;
      color: var(--muted);
    }
    button#sync {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button#sync:disabled {
      opacity: 0.6;
      cursor: default;
    }
    details {
      margin-top: 10px;
      font-size: 12px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    summary {
      cursor: pointer;
      color: var(--muted);
    }
    ul.notes {
      margin: 6px 0 0;
      padding-left: 16px;
      color: var(--fg);
      line-height: 1.5;
    }
    footer {
      margin-top: 10px;
      text-align: right;
    }
    footer a {
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
    }
    footer a:hover { color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">G</div>
      <h1>ChatGPA · Librus</h1>
    </header>
    <div class="status-row">
      <span class="dot idle" id="dot"></span>
      <span id="status">Sprawdzam…</span>
    </div>
    <div class="counts" id="counts" hidden>
      <div class="chip" style="--chip-color:#e85d5d">
        <div class="n" id="c-exams">0</div>
        <div class="l">sprawdz.</div>
      </div>
      <div class="chip" style="--chip-color:#e8a54b">
        <div class="n" id="c-homeworks">0</div>
        <div class="l">zadania</div>
      </div>
      <div class="chip" style="--chip-color:#6366f1">
        <div class="n" id="c-grades">0</div>
        <div class="l">oceny</div>
      </div>
    </div>
    <button id="sync" type="button">Synchronizuj teraz</button>
    <details id="details" hidden>
      <summary>Co znaleziono ostatnio</summary>
      <ul class="notes" id="notes"></ul>
    </details>
    <footer><a id="opts">Ustawienia</a></footer>
    <script src="popup.js"></script>
  </body>
</html>
